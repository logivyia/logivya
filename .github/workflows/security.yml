name: Security Gates
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/logivya_build
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint application
        run: npm run lint
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build production application
        run: npm run build
      - name: Block critical dependency vulnerabilities
        run: npm audit --audit-level=critical
      - name: Block high production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -t logivya:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: logivya:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: json
          output: trivy-results.json
          exit-code: "0"
      - name: Enforce container vulnerability policy
        run: node scripts/check-trivy-report.mjs trivy-results.json
      - name: Upload container vulnerability evidence
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trivy-container-report-${{ github.run_id }}
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 30
