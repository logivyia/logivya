pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
// Release v217 silently lost Screens when Windows cloud-backed dependency
// directories were skipped by the autolinker. A compilable APK is not enough:
// native-stack requires this package and its Fabric descriptors at startup.
def logivyaAutolinkingFile = new File(rootDir, "build/generated/autolinking/autolinking.json")
if (logivyaAutolinkingFile.exists()) {
  def nativeConfig = new groovy.json.JsonSlurper().parse(logivyaAutolinkingFile)
  def screens = nativeConfig.dependencies?.get('react-native-screens')?.platforms?.android
  if (!screens?.packageImportPath?.contains('RNScreensPackage') ||
      !screens?.componentDescriptors?.contains('RNSScreenComponentDescriptor')) {
    throw new GradleException("Required react-native-screens Android package is missing from autolinking. Restore the installed dependency source and regenerate autolinking before building.")
  }
} else {
  throw new GradleException("Android autolinking manifest was not generated; refusing an incomplete build.")
}
expoAutolinking.useExpoModules()

rootProject.name = 'Logivya'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
